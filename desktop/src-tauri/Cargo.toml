[package]
name = "facet"
version = "0.1.0"
description = "Desktop client for Crystalline AI workflow engine"
authors = ["Facet Contributors"]
edition = "2021"

[[bin]]
name = "facet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
signal-hook = "0.3"
dirs = "6"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Used for production builds / when no dev server is specified. The Tauri CLI
# enables this automatically for `tauri build`; do not make it a default.
custom-protocol = ["tauri/custom-protocol"]
